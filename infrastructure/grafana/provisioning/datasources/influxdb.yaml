apiVersion: 1

datasources:
  - name: InfluxDB UVFR
    uid: uvfr-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      timeInterval: 100ms
    secureJsonData:
      token: ${GRAFANA_INFLUX_TOKEN}
